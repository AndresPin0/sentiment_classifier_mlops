name: CI/CD Pipeline - Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENVIRONMENT: dev
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.parquet

jobs:
  test:
    name: Test Model (Dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py

      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          OUTPUT_PATH: ${{ env.TEST_DATA_PATH }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py

      - name: Run response tests
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
        run: pytest tests/test_model_response.py -v

      - name: Run metrics tests (Dev threshold)
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
          TEST_DATA_PATH: ${{ env.TEST_DATA_PATH }}
          MIN_ACCURACY: 0.75
          MIN_F1: 0.75
        run: pytest tests/test_model_metrics.py -v

      - name: Run API tests
        run: pytest tests/test_api.py -v

  build:
    name: Build Docker Image (Dev)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=dev \
            -t sentiment-classifier-dev:latest .

  deploy:
    name: Deploy Dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    needs: build

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      
      - name: Deploy to Render (Dev)
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

  predictions:
    name: Generate Predictions (Dev)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image (again)
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=dev \
            -t sentiment-classifier-dev:latest .

      - name: Run container and log predictions
        run: |
          docker run -d -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=dev \
            -e PREDICTIONS_DEV_FILE=/app/logs/predicciones_dev.txt \
            --name dev-container \
            sentiment-classifier-dev:latest

          sleep 15

          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"I love this product!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"This is terrible"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Great experience overall"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Very disappointed"}'

          docker cp dev-container:/app/logs/predicciones_dev.txt ./predicciones_dev.txt || true
          docker stop dev-container || true
          docker rm dev-container || true

      - name: Upload predictions to release (Dev)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-predictions-${{ github.sha }}
          name: Dev Predictions - ${{ github.sha }}
          files: predicciones_dev.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
