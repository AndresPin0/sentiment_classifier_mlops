name: CI/CD Pipeline - Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

env:
  ENVIRONMENT: dev
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.parquet

jobs:
  test:
    name: Test Model
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py || bash scripts/download_model.sh
        continue-on-error: false
      
      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          OUTPUT_PATH: ${{ env.TEST_DATA_PATH }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py || bash scripts/download_data.sh
        continue-on-error: false
      
      - name: Run response tests
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
        run: |
          pytest tests/test_model_response.py -v
      
      - name: Run metrics tests
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
          TEST_DATA_PATH: ${{ env.TEST_DATA_PATH }}
          MIN_ACCURACY: ${{ secrets.MIN_ACCURACY || '0.80' }}
          MIN_F1: ${{ secrets.MIN_F1 || '0.80' }}
        run: |
          pytest tests/test_model_metrics.py -v
      
      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      

      - name: Build Docker image
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=dev \
            -t sentiment-classifier-dev:latest \
            -t sentiment-classifier-dev:${{ github.sha }} \
            .
      
      - name: Test Docker image
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=dev \
            -e PREDICTIONS_BUCKET="${{ secrets.PREDICTIONS_BUCKET }}" \
            --name test-container \
            sentiment-classifier-dev:latest
          
          # Wait for container to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  deploy:
    name: Deploy to Cloud
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Render
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

      - name: Deploy placeholder
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: |
          echo "No deployment service configured."
          echo "Configure Render deployment:"
          echo "  - Add RENDER_API_KEY secret"
          echo "  - Add RENDER_SERVICE_ID secret"

  upload-predictions:
    name: Upload Predictions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=dev \
            -t sentiment-classifier-dev:latest \
            .
      
      - name: Get predictions log
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=dev \
            -e PREDICTIONS_DEV_FILE=/app/logs/predicciones_dev.txt \
            --name predictions-container \
            sentiment-classifier-dev:latest
          
          sleep 15
          
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "I love this product! It is amazing!"}' || true
          
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "This is terrible. I hate it."}' || true
          
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Great service and excellent quality!"}' || true
          
          sleep 5
          docker cp predictions-container:/app/logs/predicciones_dev.txt ./predicciones_dev.txt || echo "No predictions file found"
          docker stop predictions-container || true
          docker rm predictions-container || true
      
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-predictions-${{ github.sha }}
          name: Dev Predictions - ${{ github.sha }}
          body: |
            Predictions log from dev environment
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Workflow: ${{ github.workflow }}
          files: predicciones_dev.txt
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

