name: CI/CD Pipeline - Prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENVIRONMENT: prod
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.parquet

jobs:
  test:
    name: Test Model (Prod strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py

      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py

      - name: Run response tests
        run: pytest tests/test_model_response.py -v

      - name: Run metrics tests (Prod threshold)
        env:
          MIN_ACCURACY: 0.85
          MIN_F1: 0.85
        run: pytest tests/test_model_metrics.py -v

      - name: Run API tests
        run: pytest tests/test_api.py -v

  build:
    name: Build Docker Image (Prod)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest \
            -t sentiment-classifier-prod:release-${{ github.run_number }} .

  deploy:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PROD }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}

    steps:
      - name: Deploy to Render (Prod)
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

  predictions:
    name: Generate Predictions (Prod)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (Prod)
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest .

      - name: Run API Container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=prod \
            -e PREDICTIONS_PROD_FILE=/app/logs/predicciones_prod.txt \
            --name prod-container \
            sentiment-classifier-prod:latest

          echo "Waiting for API..."
          sleep 20
          curl -f http://localhost:8000/health

      - name: Generate test predictions
        run: |
          echo "Creating input texts..."
          cat << 'EOF' > texts.txt
          Absolutely fantastic product, exceeded my expectations!
          Loved the design and the performance is outstanding.
          Customer support was quick and very helpful.
          Great value for money, will buy again.
          Delivery was fast and the item works perfectly.
          Impressive quality and very easy to use.
          Five stars, highly recommended!
          The experience from purchase to delivery was excellent.
          Build quality feels premium and durable.
          I am extremely happy with this purchase.
          This product is terrible and completely useless.
          Worst purchase I have ever made.
          Customer service was unresponsive and unhelpful.
          The item arrived broken and poorly packaged.
          Very low quality, not worth the price.
          I regret buying this, it does not work at all.
          Disappointing experience from start to finish.
          It stopped working after just one day.
          Absolutely awful, do not recommend.
          A complete waste of money.
          The product is okay, but the shipping was very slow.
          Good performance, but the price seems too high.
          It works fine, nothing special though.
          Design is nice but functionality is average.
          Satisfied overall, although support could be better.
          The features are good, but the setup was confusing.
          Decent product, expected a little more.
          Quality is acceptable, delivery was poor.
          Not bad, but not great either.
          Average experience, might try another brand next time.
          I am absolutely thrilled, this is amazing!
          I can't believe how bad this is!
          This changed the way I work, incredible!
          Infuriating experience, nothing worked!
          Beyond expectations, truly exceptional!
          Utter disaster from minute one.
          So happy I bought this!
          Completely unacceptable quality!
          Mind-blowing performance!
          Angry and disappointed with the service.
          EOF

          echo "Sending texts to API..."
          while read -r text; do
            curl -s -X POST http://localhost:8000/predict \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$text\"}" || true
            sleep 0.3
          done < texts.txt

      - name: Copy prediction log
        run: |
          docker cp prod-container:/app/logs/predicciones_prod.txt ./predicciones_prod.txt || echo "No predictions file found"
          docker stop prod-container || true
          docker rm prod-container || true

      - name: Upload predictions to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: prod-predictions-${{ github.run_number }}
          name: Prod Predictions
          body: |
            Predictions log from PROD environment

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Workflow: ${{ github.workflow }}
          files: predicciones_prod.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
