name: CI/CD Pipeline - Prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENVIRONMENT: prod
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.parquet

jobs:
  test:
    name: Test Model (Prod strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py

      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py

      - name: Run response tests
        run: pytest tests/test_model_response.py -v

      - name: Run metrics tests (Prod threshold)
        env:
          MIN_ACCURACY: 0.85
          MIN_F1: 0.85
        run: pytest tests/test_model_metrics.py -v

      - name: Run API tests
        run: pytest tests/test_api.py -v

  build:
    name: Build Docker Image (Prod)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest \
            -t sentiment-classifier-prod:release-${{ github.run_number }} .

  deploy:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PROD }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}

    steps:
      - name: Deploy to Render (Prod)
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

  predictions:
    name: Generate Predictions (Prod)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image (for predictions)
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest .

      - name: Run container and generate predictions
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=prod \
            -e PREDICTIONS_PROD_FILE=/app/logs/predicciones_prod.txt \
            --name prod-container \
            sentiment-classifier-prod:latest

          sleep 20

          # -------- POSITIVOS --------
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Absolutely fantastic product, exceeded my expectations!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Loved the design and the performance is outstanding."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Customer support was quick and very helpful."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Great value for money, will buy again."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Delivery was fast and the item works perfectly."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Impressive quality and very easy to use."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Five stars, highly recommended!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"The experience from purchase to delivery was excellent."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Build quality feels premium and durable."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"I am extremely happy with this purchase."}'

          # -------- NEGATIVOS --------
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"This product is terrible and completely useless."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Worst purchase I have ever made."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Customer service was unresponsive and unhelpful."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"The item arrived broken and poorly packaged."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Very low quality, not worth the price."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"I regret buying this, it does not work at all."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Disappointing experience from start to finish."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"It stopped working after just one day."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Absolutely awful, do not recommend."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"A complete waste of money."}'

          # -------- MIXTOS / AMBIGUOS --------
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"The product is okay, but the shipping was very slow."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Good performance, but the price seems too high."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"It works fine, nothing special though."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Design is nice but functionality is average."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Satisfied overall, although support could be better."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"The features are good, but the setup was confusing."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Decent product, expected a little more."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Quality is acceptable, delivery was poor."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Not bad, but not great either."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Average experience, might try another brand next time."}'

          # -------- INTENSIDAD ALTA --------
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"I am absolutely thrilled, this is amazing!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"I can't believe how bad this is!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"This changed the way I work, incredible!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Infuriating experience, nothing worked!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Beyond expectations, truly exceptional!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Utter disaster from minute one."}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"So happy I bought this!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Completely unacceptable quality!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Mind-blowing performance!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Angry and disappointed with the service."}'

          sleep 5

          # Copy predictions log and cleanup
          docker cp prod-container:/app/logs/predicciones_prod.txt ./predicciones_prod.txt || echo "No predictions file found"
          docker stop prod-container || true
          docker rm prod-container || true

      - name: Upload predictions to GitHub Release (Prod)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: prod-predictions-${{ github.run_number }}
          name: Prod Predictions
          body: |
            Predictions log from PROD environment
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Workflow: ${{ github.workflow }}
          files: predicciones_prod.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

