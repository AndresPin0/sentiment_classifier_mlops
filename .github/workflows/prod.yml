name: CI/CD Pipeline - Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  ENVIRONMENT: prod
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.json

jobs:
  test:
    name: Test Model
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py || bash scripts/download_model.sh
        continue-on-error: false
      
      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          OUTPUT_PATH: ${{ env.TEST_DATA_PATH }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py || bash scripts/download_data.sh
        continue-on-error: false
      
      - name: Run response tests
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
        run: |
          pytest tests/test_model_response.py -v
      
      - name: Run metrics tests
        env:
          MODEL_PATH: ${{ env.MODEL_PATH }}
          TEST_DATA_PATH: ${{ env.TEST_DATA_PATH }}
          MIN_ACCURACY: ${{ secrets.MIN_ACCURACY || '0.80' }}
          MIN_F1: ${{ secrets.MIN_F1 || '0.80' }}
        run: |
          pytest tests/test_model_metrics.py -v
      
      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub (optional)
        if: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker image
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest \
            -t sentiment-classifier-prod:${{ github.sha }} \
            .
      
      - name: Test Docker image
        run: |
          docker run -d \
            -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=prod \
            -e PREDICTIONS_BUCKET="${{ secrets.PREDICTIONS_BUCKET }}" \
            --name test-container \
            sentiment-classifier-prod:latest
          
          # Wait for container to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  deploy:
    name: Deploy to Cloud
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to cloud service
        run: |
          echo "Deployment steps for prod environment"
          echo "This would typically deploy to your cloud service (e.g., Railway, Render, AWS, GCP)"
          echo "Example commands:"
          echo "  - Push to container registry"
          echo "  - Update cloud service configuration"
          echo "  - Trigger deployment"
          echo ""
          echo "For Railway: railway up"
          echo "For Render: render deploy"
          echo "For AWS: aws ecs update-service"
          echo "For GCP: gcloud run deploy"
          
          # Add your deployment commands here
          # Example for Railway:
          # railway login --token ${{ secrets.RAILWAY_TOKEN }}
          # railway up --service sentiment-classifier-prod
          
          # Example for Render:
          # curl -X POST "https://api.render.com/deploy/srv-xxx" \
          #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

