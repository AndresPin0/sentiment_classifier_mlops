name: CI/CD Pipeline - Prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENVIRONMENT: prod
  MODEL_PATH: ./models/model.onnx
  TEST_DATA_PATH: ./test_data/test_data.parquet

jobs:
  test:
    name: Test Model (Prod strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          mkdir -p models
          python scripts/download_model.py

      - name: Download test data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
        run: |
          mkdir -p test_data
          python scripts/download_data.py

      - name: Run response tests
        run: pytest tests/test_model_response.py -v

      - name: Run metrics tests (Prod threshold)
        env:
          MIN_ACCURACY: 0.85
          MIN_F1: 0.85
        run: pytest tests/test_model_metrics.py -v

      - name: Run API tests
        run: pytest tests/test_api.py -v

  build:
    name: Build Docker Image (Prod)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build \
            --build-arg MODEL_URL="${{ secrets.MODEL_URL }}" \
            --build-arg ENVIRONMENT=prod \
            -t sentiment-classifier-prod:latest \
            -t sentiment-classifier-prod:release-${{ github.run_number }} .

  deploy:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PROD }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}

    steps:
      - name: Deploy to Render (Prod)
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

  predictions:
    name: Generate Predictions (Prod)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'

    steps:
      - uses: actions/checkout@v3

      - name: Run container and log predictions
        run: |
          docker run -d -p 8000:8000 \
            -e MODEL_URL="${{ secrets.MODEL_URL }}" \
            -e ENVIRONMENT=prod \
            -e PREDICTIONS_PROD_FILE=/app/logs/predicciones_prod.txt \
            --name prod-container \
            sentiment-classifier-prod:latest

          sleep 20

          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Amazing service!"}'
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"text":"Completely unusable"}'

          docker cp prod-container:/app/logs/predicciones_prod.txt ./predicciones_prod.txt || true
          docker stop prod-container || true
          docker rm prod-container || true

      - name: Upload predictions to release (Prod)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: prod-predictions-${{ github.run_number }}
          name: Prod Predictions
          files: predicciones_prod.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
